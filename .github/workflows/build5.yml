# QR Güvenli: tek dosyayla gerçek APK derleyen GitHub Actions workflow'u
# Konum: .github/workflows/build-apk.yml
# Opsiyonel: repo köküne icon.png (512x512) koyarsan uygulama ikonu o olur.
# APK: Actions > son çalışma > Artifacts, ya da Releases sayfasından indir.
name: QR Güvenli APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK paketleri
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$(command -v sdkmanager)"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-33" "build-tools;34.0.0" > /dev/null || true
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Cordova projesi oluştur
        run: |
          npm install -g cordova@12.0.0
          cordova create app com.jjj.qrguvenli "QR Güvenli"
          rm -rf app/www/*
          mkdir -p app/www/css app/www/js app/www/img app/res

      - name: Uygulama dosyalarını yaz
        run: |
          cat > app/www/index.html <<'EOF_0'
          <!DOCTYPE html>
          <html lang="tr"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; frame-src https:; connect-src 'self'">
          <title>QR Güvenli</title><link rel="stylesheet" href="css/style.css"></head>
          <body>
          <header><img src="img/icon.png" alt=""><h1>QR Güvenli</h1></header>
          <main>
          <section id="p1">
          <label>Tür</label>
          <select id="type"><option value="text">Metin / Link</option><option value="wifi">Wi-Fi</option><option value="mail">E-posta</option><option value="tel">Telefon</option><option value="sms">SMS</option><option value="wa">WhatsApp</option><option value="geo">Konum</option><option value="vcard">Kartvizit (vCard)</option></select>
          <div id="fields"></div>
          <label class="ck"><input type="checkbox" id="batch"> Toplu üret (Metin türünde her satır ayrı kod)</label>
          <label>Format</label>
          <select id="fmt"><option value="qr">QR Kod</option><option value="ean">Barkod EAN-13</option><option value="ean8">Barkod EAN-8</option><option value="upc">Barkod UPC-A</option><option value="c39">Barkod Code 39</option><option value="c128">Barkod Code 128</option></select>
          <details id="sty"><summary>🎨 Tasarım (renk, şekil, logo)</summary>
          <label>Hazır temalar</label><div class="chips" id="pre"></div>
          <div class="g2"><div><label>Renk</label><input type="color" id="fg" value="#000000"></div><div><label>2. renk (degrade)</label><input type="color" id="fg2" value="#7c4dff"></div>
          <div><label>Köşe renk</label><input type="color" id="ec" value="#000000"></div><div><label>Zemin</label><input type="color" id="bg" value="#ffffff"></div></div>
          <label class="ck"><input type="checkbox" id="grad"> Degrade kullan</label>
          <div class="g2"><div><label>Nokta şekli</label><select id="shape"><option value="0">Kare</option><option value="1">Yuvarlak nokta</option><option value="2">Yumuşak kare</option><option value="3">Elmas</option></select></div>
          <div><label>Köşe şekli</label><select id="eye"><option value="0">Kare</option><option value="1">Yumuşak</option><option value="2">Daire</option></select></div></div>
          <label>Hata düzeltme</label><select id="ecl"><option value="a">Otomatik</option><option value="0">Düşük (L)</option><option value="1">Orta (M)</option><option value="2">Yüksek (Q)</option><option value="3">En yüksek (H)</option></select>
          <label>Ortaya logo</label><input type="file" id="logo" accept="image/*">
          <label>Logo boyutu: <span id="lsv">20</span>%</label><input type="range" id="ls" min="10" max="26" value="20">
          <button id="nologo" class="sm">Logoyu kaldır</button>
          <label>Alt yazı</label><input id="cap" maxlength="30" placeholder="Örn: Beni tara">
          </details>
          <button id="gen" class="big">Oluştur</button>
          <p id="err" class="err"></p>
          <div class="card" id="out" hidden><canvas id="cv"></canvas>
          <div class="row"><button id="sh">Paylaş / Kaydet</button><button id="sv">★ Kaydet</button></div></div>
          <div id="bt"></div>
          </section>
          <section id="p2" hidden>
          <video id="vid" playsinline muted></video>
          <div class="row"><button id="cam" class="big">Kamerayı aç</button><button id="tor" hidden>🔦</button></div>
          <input type="range" id="zm" hidden>
          <label class="file">Galeriden oku<input type="file" id="img" accept="image/*"></label>
          <p id="serr" class="err"></p>
          <div class="card" id="res" hidden><div class="tag" id="rk"></div><div id="rbody"></div><div id="rrisk"></div><div class="row wrap" id="acts"></div><div id="pv"></div></div>
          </section>
          <section id="p3" hidden>
          <input id="q" placeholder="Ara...">
          <div class="chips" id="chips"></div>
          <div id="lst"></div>
          <div class="row"><button id="exp">Dışa aktar</button></div>
          </section>
          <section id="p4" hidden>
          <label class="ck"><input type="checkbox" id="s_wifi"> Wi-Fi QR okununca otomatik bağlan</label>
          <label class="ck"><input type="checkbox" id="s_save"> Okunanları klasörlere otomatik kaydet</label>
          <label class="ck"><input type="checkbox" id="s_prev"> Linkleri otomatik ön izle (siteye istek atar)</label>
          <label class="ck"><input type="checkbox" id="s_beep"> Okununca bip sesi</label>
          <label class="ck"><input type="checkbox" id="s_vib"> Okununca titreşim</label>
          <label class="ck"><input type="checkbox" id="s_light"> Açık tema</label>
          <label>Güvendiğim siteler (her satıra bir alan adı)</label>
          <textarea id="s_trust" rows="4" placeholder="example.com"></textarea>
          <button id="s_clr" class="big bad">Tüm verileri sil</button>
          <p class="mu">QR Güvenli v1.1: okunan hiçbir site otomatik açılmaz.</p>
          </section>
          </main>
          <nav><button id="t1" class="on">➕<span>Oluştur</span></button><button id="t2">📷<span>Tara</span></button><button id="t3">📁<span>Klasör</span></button><button id="t4">⚙️<span>Ayar</span></button></nav>
          <div id="toast"></div>
          <script src="cordova.js"></script><script src="js/qr.js"></script><script src="js/barcode.js"></script><script src="js/jsQR.js"></script><script src="js/app.js"></script>
          </body></html>

          EOF_0
          cat > app/www/css/style.css <<'EOF_1'
          :root{--bg:#12101c;--cd:#1b172b;--in:#221e35;--tx:#eee;--mu:#9a96b5;--ac:#7c4dff;--bd:#352f52}
          body.light{--bg:#f4f1ff;--cd:#fff;--in:#ece7ff;--tx:#1a1033;--mu:#6b6590;--bd:#d6cdf7}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(70px + env(safe-area-inset-bottom))}
          header{display:flex;align-items:center;gap:10px;padding:14px 16px}header img{width:34px;border-radius:8px}h1{font-size:20px;margin:0}
          main{padding:0 16px 16px}label{display:block;margin:12px 0 6px;color:var(--mu);font-size:13px}
          .ck{display:flex;gap:10px;align-items:center;color:var(--tx);font-size:14px}.ck input{width:20px;height:20px;margin:0}
          input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--in);color:var(--tx);font-size:15px;margin-bottom:4px}
          input[type=color]{height:44px;padding:3px}input[type=range]{padding:0}
          button{padding:12px 14px;border:0;border-radius:12px;background:var(--in);color:var(--tx);font-size:15px}
          .big{width:100%;background:var(--ac);color:#fff;margin-top:12px}.sm{padding:8px 12px;font-size:13px;margin-top:6px}.bad{background:#c0392b}
          details{background:var(--cd);border-radius:14px;padding:12px;margin-top:12px}summary{font-weight:600}
          .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
          .card{background:var(--cd);border-radius:16px;padding:14px;margin-top:16px;text-align:center}
          canvas{max-width:100%;border-radius:10px;margin:6px 0}
          .row{display:flex;gap:8px;margin-top:10px}.row button{flex:1}.wrap{flex-wrap:wrap}
          .err{color:#ff6b6b;min-height:1em}.mu{color:var(--mu)}
          video{width:100%;border-radius:14px;background:#000;max-height:46vh}
          .file{background:var(--in);border-radius:12px;padding:12px;text-align:center;color:var(--tx);margin-top:10px}.file input{display:none}
          pre{white-space:pre-wrap;word-break:break-all;text-align:left;background:var(--bg);padding:10px;border-radius:10px;margin:8px 0}
          .ok{color:#2ecc71}.warn{color:#f39c12}.bd{color:#ff5c5c}#rrisk,#rbody{text-align:left;line-height:1.6}
          .tag{display:inline-block;background:var(--ac);color:#fff;border-radius:20px;padding:3px 12px;font-size:12px}
          .chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0}.chips button{white-space:nowrap;padding:8px 12px;font-size:13px}.chips .on{background:var(--ac);color:#fff}
          .it{display:flex;align-items:center;gap:6px;background:var(--cd);border-radius:12px;padding:10px;margin-top:8px}.it .tx{flex:1;word-break:break-all;font-size:14px}.it small{display:block;color:var(--mu)}
          iframe{width:100%;height:300px;border:1px solid var(--bd);border-radius:10px;background:#fff;margin-top:10px}
          nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
          nav button{flex:1;background:none;border-radius:0;display:flex;flex-direction:column;align-items:center;font-size:20px;padding:8px 0;color:var(--mu)}nav span{font-size:11px}nav .on{color:var(--ac)}
          #toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;max-width:90%}#toast.show{opacity:1}
          #bt .card{display:inline-block;margin:8px;width:45%}

          EOF_1
          cat > app/www/js/qr.js <<'EOF_2'
          var QR=(function(){
          var E=[[-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28],[-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26],[-1,13,22,18,26,18,24,18,22,20,24,28,26,24,20,30,24,28,28,26,30],[-1,17,28,22,16,22,28,26,26,24,28,24,28,22,24,24,30,28,28,26,28]];
          var B=[[-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8],[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16],[-1,1,1,2,2,4,4,6,6,8,8,8,10,12,16,12,17,16,18,21,20],[-1,1,1,2,4,4,4,5,6,8,8,11,11,16,16,18,16,19,21,25,25]];
          var FB=[1,0,3,2];
          function raw(v){var r=(16*v+128)*v+64;if(v>=2){var n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36}return r}
          function cap(v,e){return Math.floor(raw(v)/8)-E[e][v]*B[e][v]}
          function mul(x,y){var z=0;for(var i=7;i>=0;i--){z=(z<<1)^((z>>>7)*285);z^=((y>>>i)&1)*x}return z}
          function div(n){var r=[];for(var i=0;i<n;i++)r.push(0);r[n-1]=1;var root=1;for(i=0;i<n;i++){for(var j=0;j<n;j++){r[j]=mul(r[j],root);if(j+1<n)r[j]^=r[j+1]}root=mul(root,2)}return r}
          function rem(d,g){var r=g.map(function(){return 0});d.forEach(function(b){var f=b^r.shift();r.push(0);g.forEach(function(c,i){r[i]^=mul(c,f)})});return r}
          function enc(text,e){
          var by=Array.from(new TextEncoder().encode(text)),v=1;
          for(;;v++){if(v>20)throw new Error("Metin çok uzun (en fazla ~600 karakter)");var cb=v<10?8:16;if(4+cb+by.length*8<=cap(v,e)*8)break}
          var bits=[];function put(val,n){for(var i=n-1;i>=0;i--)bits.push((val>>>i)&1)}
          put(4,4);put(by.length,v<10?8:16);by.forEach(function(b){put(b,8)});
          var cb8=cap(v,e)*8;put(0,Math.min(4,cb8-bits.length));while(bits.length%8)bits.push(0);
          for(var p=0xEC;bits.length<cb8;p^=0xEC^0x11)put(p,8);
          var data=[];for(var i=0;i<bits.length;i+=8){var x=0;for(var k=0;k<8;k++)x=(x<<1)|bits[i+k];data.push(x)}
          var nb=B[e][v],el=E[e][v],rc=Math.floor(raw(v)/8),ns=nb-rc%nb,sl=Math.floor(rc/nb),g=div(el),bl=[],q=0;
          for(i=0;i<nb;i++){var d=data.slice(q,q+sl-el+(i<ns?0:1));q+=d.length;var ec=rem(d,g);if(i<ns)d.push(0);bl.push(d.concat(ec))}
          var all=[];for(i=0;i<bl[0].length;i++)bl.forEach(function(b,j){if(i!=sl-el||j>=ns)all.push(b[i])});
          return build(v,e,all)}
          function build(v,e,cw){
          var s=v*4+17,m=[],f=[];for(var y=0;y<s;y++){m.push(new Array(s).fill(false));f.push(new Array(s).fill(false))}
          function set(x,y,d){m[y][x]=d;f[y][x]=true}
          for(var i=0;i<s;i++){set(6,i,i%2==0);set(i,6,i%2==0)}
          function fin(cx,cy){for(var dy=-4;dy<=4;dy++)for(var dx=-4;dx<=4;dx++){var d=Math.max(Math.abs(dx),Math.abs(dy)),x=cx+dx,y=cy+dy;if(x>=0&&x<s&&y>=0&&y<s)set(x,y,d!=2&&d!=4)}}
          fin(3,3);fin(s-4,3);fin(3,s-4);
          var na=v==1?0:Math.floor(v/7)+2,ap=[];
          if(na){var st=v==32?26:Math.ceil((v*4+4)/(na*2-2))*2;ap=[6];for(var p=s-7;ap.length<na;p-=st)ap.splice(1,0,p)}
          ap.forEach(function(a,i){ap.forEach(function(b,j){if((i==0&&j==0)||(i==0&&j==na-1)||(i==na-1&&j==0))return;for(var dy=-2;dy<=2;dy++)for(var dx=-2;dx<=2;dx++)set(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!=1)})});
          function fmt(mask){var d=FB[e]<<3|mask,r=d;for(var i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);var b=(d<<10|r)^0x5412;function g(i){return((b>>>i)&1)==1}
          for(i=0;i<6;i++)set(8,i,g(i));set(8,7,g(6));set(8,8,g(7));set(7,8,g(8));for(i=9;i<15;i++)set(14-i,8,g(i));
          for(i=0;i<8;i++)set(s-1-i,8,g(i));for(i=8;i<15;i++)set(8,s-15+i,g(i));set(8,s-8,true)}
          fmt(0);
          if(v>=7){var r=v;for(i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);var vb=v<<12|r;for(i=0;i<18;i++){var bt=((vb>>>i)&1)==1,a=s-11+i%3,c=Math.floor(i/3);set(a,c,bt);set(c,a,bt)}}
          var k=0;for(var rt=s-1;rt>=1;rt-=2){if(rt==6)rt=5;for(var vt=0;vt<s;vt++)for(var j=0;j<2;j++){var x=rt-j,up=((rt+1)&2)==0,y=up?s-1-vt:vt;if(!f[y][x]&&k<cw.length*8){m[y][x]=((cw[k>>>3]>>>(7-(k&7)))&1)==1;k++}}}
          var M=[function(x,y){return(x+y)%2==0},function(x,y){return y%2==0},function(x,y){return x%3==0},function(x,y){return(x+y)%3==0},function(x,y){return(Math.floor(x/3)+Math.floor(y/2))%2==0},function(x,y){return x*y%2+x*y%3==0},function(x,y){return(x*y%2+x*y%3)%2==0},function(x,y){return((x+y)%2+x*y%3)%2==0}];
          function ap2(n){for(var y=0;y<s;y++)for(var x=0;x<s;x++)if(!f[y][x]&&M[n](x,y))m[y][x]=!m[y][x]}
          function pen(){var p=0;for(var a=0;a<2;a++)for(var i=0;i<s;i++){var run=1;for(var j=1;j<s;j++){var c=a?m[j][i]:m[i][j],d=a?m[j-1][i]:m[i][j-1];if(c==d){run++;if(run==5)p+=3;else if(run>5)p++}else run=1}}var dk=0;m.forEach(function(r){r.forEach(function(c){if(c)dk++})});return p+Math.floor(Math.abs(dk*20-s*s*10)/(s*s))*10}
          var best=0,bp=1e9;for(var n=0;n<8;n++){ap2(n);fmt(n);var pp=pen();if(pp<bp){bp=pp;best=n}ap2(n)}
          ap2(best);fmt(best);return m}
          return{make:function(t,lvl){return enc(t,lvl==null?1:lvl)}}})();

          EOF_2
          cat > app/www/js/barcode.js <<'EOF_3'
          var BC=(function(){
          var L=["0001101","0011001","0010011","0111101","0100011","0110001","0101111","0111011","0110111","0001011"];
          function R(c){return c.replace(/./g,function(x){return x=="0"?"1":"0"})}
          function G(c){return R(c).split("").reverse().join("")}
          var P=["LLLLLL","LLGLGG","LLGGLG","LLGGGL","LGLLGG","LGGLLG","LGGGLL","LGLGLG","LGLGGL","LGGLGL"];
          function ck(d,w){var s=0;d.forEach(function(x,i){s+=x*w[i%2]});return(10-s%10)%10}
          function ean(t){if(!/^\d{12,13}$/.test(t))throw new Error("EAN-13 için 12 veya 13 rakam gir");
          var d=t.slice(0,12).split("").map(Number),c=ck(d,[1,3]);if(t.length==13&&+t[12]!=c)throw new Error("Kontrol hanesi hatalı, doğrusu: "+c);d.push(c);
          var o="101",p=P[d[0]],i;for(i=1;i<7;i++)o+=p[i-1]=="L"?L[d[i]]:G(L[d[i]]);o+="01010";for(i=7;i<13;i++)o+=R(L[d[i]]);o+="101";return{bits:o,label:d.join("")}}
          function ean8(t){if(!/^\d{7,8}$/.test(t))throw new Error("EAN-8 için 7 veya 8 rakam gir");
          var d=t.slice(0,7).split("").map(Number),c=ck(d,[3,1]);if(t.length==8&&+t[7]!=c)throw new Error("Kontrol hanesi hatalı, doğrusu: "+c);d.push(c);
          var o="101",i;for(i=0;i<4;i++)o+=L[d[i]];o+="01010";for(i=4;i<8;i++)o+=R(L[d[i]]);o+="101";return{bits:o,label:d.join("")}}
          function upca(t){if(!/^\d{11,12}$/.test(t))throw new Error("UPC-A için 11 veya 12 rakam gir");var r=ean("0"+t);return{bits:r.bits,label:r.label.slice(1)}}
          var C={"0":"nnnwwnwnn","1":"wnnwnnnnw","2":"nnwwnnnnw","3":"wnwwnnnnn","4":"nnnwwnnnw","5":"wnnwwnnnn","6":"nnwwwnnnn","7":"nnnwnnwnw","8":"wnnwnnwnn","9":"nnwwnnwnn","A":"wnnnnwnnw","B":"nnwnnwnnw","C":"wnwnnwnnn","D":"nnnnwwnnw","E":"wnnnwwnnn","F":"nnwnwwnnn","G":"nnnnnwwnw","H":"wnnnnwwnn","I":"nnwnnwwnn","J":"nnnnwwwnn","K":"wnnnnnnww","L":"nnwnnnnww","M":"wnwnnnnwn","N":"nnnnwnnww","O":"wnnnwnnwn","P":"nnwnwnnwn","Q":"nnnnnnwww","R":"wnnnnnwwn","S":"nnwnnnwwn","T":"nnnnwnwwn","U":"wwnnnnnnw","V":"nwwnnnnnw","W":"wwwnnnnnn","X":"nwnnwnnnw","Y":"wwnnwnnnn","Z":"nwwnwnnnn","-":"nwnnnnwnw",".":"wwnnnnwnn"," ":"nwwnnnwnn","*":"nwnnwnwnn"};
