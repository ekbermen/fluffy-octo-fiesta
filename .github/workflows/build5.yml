          function connect(w){if(!w.S)return;if(!window.WifiWizard2){toast("Wi-Fi eklentisi yok, şifreyi kopyala");return}
          var al=/^(WPA|SAE)/i.test(w.T||"")?"WPA":/^WEP/i.test(w.T||"")?"WEP":"NONE";toast("Bağlanılıyor: "+w.S);
          WifiWizard2.connect(w.S,true,w.P||"",al,w.H=="true").then(function(){toast("Bağlandı: "+w.S)}).catch(function(){toast("Bağlanamadı, şifreyi kontrol et")})}
          $("acts").onclick=function(e){var a=e.target.dataset.a,k=kind(CS);if(!a)return;
          if(a=="cp")copy(k=="wifi"?pw(CS).P||"":CS);
          else if(a=="prev"){if(confirm("Ön izleme siteye bağlanır (IP adresin görünür). Devam?"))preview(CS)}
          else if(a=="open")ext(CS);
          else if(a=="trust"&&HOST){S.trust+=(S.trust?"\n":"")+HOST;sv("qrs",S);$("s_trust").value=S.trust;show(CS);toast("Güvenilir listeye eklendi")}
          else if(a=="conn")connect(pw(CS));
          else if(a=="rev"){$("pwv").textContent=pw(CS).P||"yok"}};
          /* ---------- AYARLAR ---------- */
          function theme(){document.body.className=S.light?"light":""}
          ["wifi","save","prev","beep","vib","light"].forEach(function(k){var c=$("s_"+k);c.checked=!!S[k];c.onchange=function(){S[k]=c.checked;sv("qrs",S);theme()}});
          $("s_trust").value=S.trust;$("s_trust").onchange=function(){S.trust=$("s_trust").value;sv("qrs",S)};
          $("s_clr").onclick=function(){if(confirm("Geçmiş ve ayarlar silinsin mi?")){try{LS.clear()}catch(e){}H=[];toast("Silindi");location.reload()}};
          theme();
          })();

          EOF_4

      - name: Taramayı güçlendir (jsQR) ve ikon üret
        run: |
          npm install --prefix /tmp/jq jsqr@1.4.0
          cp /tmp/jq/node_modules/jsqr/dist/jsQR.js app/www/js/jsQR.js
          cd app
          python3 - <<'PY'
          import zlib,struct
          n=512
          bg=(18,16,28);c=(124,77,255)
          px=[[bg]*n for _ in range(n)]
          def sq(x,y,s,col):
              for i in range(s):
                  for j in range(s): px[y+i][x+j]=col
          def eye(x,y,s):
              sq(x,y,s,c);sq(x+s//7,y+s//7,s*5//7,bg);sq(x+s*2//7,y+s*2//7,s*3//7,c)
          s=n*3//10;m=n//8
          eye(m*2,m*2,s);eye(n-m*2-s,m*2,s);eye(m*2,n-m*2-s,s)
          for k in range(6):
              for l in range(6):
                  if (k*7+l*3)%3: sq(n//2+k*n//16,n//2+l*n//16,n//20,c)
          raw=b''.join(b'\x00'+bytes(v for p in r for v in p) for r in px)
          def ch(t,d):
              b=t+d;return struct.pack('>I',len(d))+b+struct.pack('>I',zlib.crc32(b)&0xffffffff)
          open('res/icon.png','wb').write(b'\x89PNG\r\n\x1a\n'+ch(b'IHDR',struct.pack('>IIBBBBB',n,n,8,2,0,0,0))+ch(b'IDAT',zlib.compress(raw))+ch(b'IEND',b''))
          PY
          if [ -f ../icon.png ]; then cp ../icon.png res/icon.png; fi
          cp res/icon.png www/img/icon.png

      - name: config.xml yaz
        run: |
          cat > app/config.xml <<EOF_CFG
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.jjj.qrguvenli" version="1.1.${GITHUB_RUN_NUMBER}" android-versionCode="${GITHUB_RUN_NUMBER}" xmlns="http://www.w3.org/ns/widgets" xmlns:android="http://schemas.android.com/apk/res/android">
              <name>QR Güvenli</name>
              <description>QR kod ve barkod üretici + güvenli okuyucu</description>
              <author email="a@b.c">Jjj</author>
              <content src="index.html" />
              <access origin="*" launch-external="yes" />
              <allow-navigation href="about:blank" />
              <preference name="Orientation" value="portrait" />
              <preference name="android-minSdkVersion" value="24" />
              <preference name="android-targetSdkVersion" value="33" />
              <preference name="AndroidXEnabled" value="true" />
              <platform name="android">
                  <icon src="res/icon.png" density="mdpi" />
                  <icon src="res/icon.png" density="hdpi" />
                  <icon src="res/icon.png" density="xhdpi" />
                  <icon src="res/icon.png" density="xxhdpi" />
                  <icon src="res/icon.png" density="xxxhdpi" />
                  <config-file target="AndroidManifest.xml" parent="/manifest">
                      <uses-permission android:name="android.permission.CAMERA" />
                      <uses-permission android:name="android.permission.VIBRATE" />
                      <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
                      <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
                      <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
                      <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />
                      <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
                  </config-file>
              </platform>
          </widget>
          EOF_CFG

      - name: Android platformu ve eklentiler
        working-directory: app
        run: |
          cordova platform add android@12.0.1
          cordova plugin add cordova-plugin-android-permissions || echo "izin eklentisi eklenemedi"
          cordova plugin add cordova-plugin-wifiwizard2 || echo "wifi eklentisi eklenemedi"
          cordova plugin add cordova-plugin-x-socialsharing || echo "paylaşım eklentisi eklenemedi"
          cordova plugin add cordova-plugin-inappbrowser || echo "tarayıcı eklentisi eklenemedi"

      - name: İmza anahtarını önbellekten al
        uses: actions/cache@v4
        with:
          path: qr.keystore
          key: qr-keystore-v1

      - name: İmza anahtarı oluştur
        run: |
          [ -f qr.keystore ] || keytool -genkeypair -keystore qr.keystore -alias qr -keyalg RSA -keysize 2048 -validity 10000 -storepass qrguvenli -keypass qrguvenli -dname "CN=QR Guvenli"
          cat > app/build.json <<EOF_BJ
          {"android":{"release":{"keystore":"$GITHUB_WORKSPACE/qr.keystore","storePassword":"qrguvenli","alias":"qr","password":"qrguvenli","packageType":"apk"}}}
          EOF_BJ

      - name: APK derle (debug + imzalı release)
        working-directory: app
        run: |
          cordova build android --debug
          cordova build android --release --buildConfig=build.json || echo "release derlenemedi, debug APK kullan"

      - uses: actions/upload-artifact@v4
        with:
          name: QR-Guvenli-APK
          path: app/platforms/android/app/build/outputs/apk/**/*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: QR Güvenli v${{ github.run_number }}
          files: app/platforms/android/app/build/outputs/apk/**/*.apk
